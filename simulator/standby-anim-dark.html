<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Режим ожидания — тёмная анимация</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --backdrop:#111417; --ink:#e9eef2; --muted:#93a3ae; color-scheme:dark; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--backdrop);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px max(16px,env(safe-area-inset-left,0px))}
.note{color:#7c8892;font-size:13px}
.rig{position:relative;flex:none}
.device{position:absolute;left:0;top:0;width:1064px;height:640px;padding:20px;border-radius:28px;background:linear-gradient(160deg,#2a3036,#1b1f23);
  box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);transform-origin:0 0}
.screen{position:relative;width:1024px;height:600px;border-radius:6px;overflow:hidden;background:#0b0f13}
canvas{position:absolute;inset:0;width:1024px;height:600px}
.txt{position:absolute;left:0;right:0;top:452px;text-align:center}
.txt b{display:block;font-size:30px;font-weight:600;color:#fff;letter-spacing:-.2px}
.txt span{display:block;font-size:17px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="note">Превью анимации для экрана «Режим ожидания» · 1024×600</div>
<div class="rig" id="rig"><div class="device" id="device"><div class="screen">
  <canvas id="weld" width="1024" height="600"></canvas>
  <div class="txt"><b>Режим ожидания</b><span>Коснитесь экрана, чтобы продолжить</span></div>
</div></div></div>

<script>
/* Орбитальная сварка трубы в разрезе: горелка идёт по кругу, за ней остывает шов
   (белый → оранжевый → цвета побежалости → серый), из точки дуги летят искры. */
function initWeldAnim(cv){
  const ctx=cv.getContext('2d');
  const W=1024, H=600, CX=512, CY=214, RO=106, RI=80, RB=RO+4, BW=10;
  const PERIOD=10000, TRAIL=330;
  const rad=d=>d*Math.PI/180;
  const pt=(a,r)=>[CX+r*Math.sin(rad(a)), CY-r*Math.cos(rad(a))];
  let dpr=1, redraw=null;
  function size(){ dpr=Math.min(2,window.devicePixelRatio||1); cv.width=W*dpr; cv.height=H*dpr; if(redraw) redraw(); }
  size(); addEventListener('resize',size);

  // цвет шва по «возрасту» в градусах за горелкой
  const STOPS=[[0,'#ffffff'],[5,'#fff1bf'],[14,'#ffc24d'],[30,'#ff7a1a'],[50,'#b4501a'],[75,'#a7803e'],[100,'#6f5a8c'],[125,'#4d6a94'],[170,'#5c6a75'],[330,'#63717c']];
  const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const STOPS_RGB=STOPS.map(([d,c])=>[d,hex(c)]);
  function beadRGB(d){
    for(let i=1;i<STOPS_RGB.length;i++){ const [d1,c1]=STOPS_RGB[i]; if(d<=d1){ const [d0,c0]=STOPS_RGB[i-1], t=(d-d0)/(d1-d0);
      return c0.map((v,k)=>Math.round(v+(c1[k]-v)*t)); } }
    return STOPS_RGB[STOPS_RGB.length-1][1];
  }

  function pipe(){
    // стенка трубы
    let g=ctx.createRadialGradient(CX-46,CY-58,10,CX,CY,RO);
    g.addColorStop(0,'#cfd8df'); g.addColorStop(.55,'#8d9ba7'); g.addColorStop(1,'#56636e');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(CX,CY,RO,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.08)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(CX,CY,(RO+RI)/2,0,Math.PI*2); ctx.stroke();
    // полость
    g=ctx.createRadialGradient(CX,CY,10,CX,CY,RI);
    g.addColorStop(0,'#05070a'); g.addColorStop(1,'#151c23');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(CX,CY,RI,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(CX,CY,RI,0,Math.PI*2); ctx.stroke();
    // блик сверху слева
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(CX,CY,RO-3,Math.PI*1.05,Math.PI*1.45); ctx.stroke();
  }
  function ticks(){
    ctx.strokeStyle='rgba(160,180,195,.14)'; ctx.lineWidth=1.2;
    for(let i=0;i<72;i++){ const a=i*5, long=i%18===0; const [x0,y0]=pt(a,196), [x1,y1]=pt(a,long?208:202);
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); }
  }
  function bead(theta){
    ctx.lineCap='butt';
    // тень под швом — отделяет валик от стенки трубы
    ctx.lineWidth=BW+4; ctx.strokeStyle='rgba(10,16,22,.38)';
    ctx.beginPath(); ctx.arc(CX,CY,RB,rad(theta-292)-Math.PI/2,rad(theta)-Math.PI/2); ctx.stroke();
    ctx.lineWidth=BW;
    for(let d=TRAIL; d>=0; d-=1){
      const a=theta-d, c=beadRGB(d), alpha=d>290?(TRAIL-d)/40:1;
      ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${alpha.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(CX,CY,RB,rad(a-1.15)-Math.PI/2,rad(a)-Math.PI/2); ctx.stroke();
    }
    // чешуйки шва — привязаны к углу трубы, не «ползут» вместе с горелкой
    const step=2.6, from=Math.ceil((theta-290)/step)*step;
    ctx.lineWidth=1.1;
    for(let a=from; a<=theta-6; a+=step){
      const d=theta-a, alpha=(d>250?(290-d)/40:1)*(d<40?.35:.2);
      const [x0,y0]=pt(a,RB-BW/2+1.5), [xm,ym]=pt(a-1.1,RB), [x1,y1]=pt(a,RB+BW/2-1.5);
      ctx.strokeStyle=`rgba(255,255,255,${alpha.toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.quadraticCurveTo(xm,ym,x1,y1); ctx.stroke();
    }
  }
  function glow(theta,f){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    // тёплое свечение раскалённой части шва
    for(let d=0; d<=44; d+=4){ const [x,y]=pt(theta-d,RB), r=30-d*.35, a=(.16-d*.0032)*f;
      const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(255,150,60,${a})`); g.addColorStop(1,'rgba(255,120,40,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
    // дуга
    const [x,y]=pt(theta,RO+2);
    let g=ctx.createRadialGradient(x,y,0,x,y,150);
    g.addColorStop(0,`rgba(205,228,255,${.55*f})`); g.addColorStop(.25,`rgba(140,185,255,${.18*f})`); g.addColorStop(1,'rgba(90,140,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,150,0,Math.PI*2); ctx.fill();
    g=ctx.createRadialGradient(x,y,0,x,y,16); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(1,'rgba(220,235,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,16*f,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function torch(theta){
    ctx.save(); ctx.translate(CX,CY); ctx.rotate(rad(theta));
    const y0=-(RO+8);
    // электрод
    ctx.strokeStyle='#c7cfd6'; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(0,-(RO+3)); ctx.lineTo(0,y0-6); ctx.stroke();
    // керамическое сопло
    let g=ctx.createLinearGradient(-14,0,14,0); g.addColorStop(0,'#a8927a'); g.addColorStop(.45,'#e8d8c3'); g.addColorStop(1,'#8f7a64');
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-6,y0); ctx.lineTo(6,y0); ctx.lineTo(13,y0-26); ctx.lineTo(-13,y0-26); ctx.closePath(); ctx.fill();
    // корпус горелки
    g=ctx.createLinearGradient(-15,0,15,0); g.addColorStop(0,'#1b232a'); g.addColorStop(.4,'#4a5864'); g.addColorStop(1,'#151b21');
    ctx.fillStyle=g; roundRect(-14,y0-74,28,50,7); ctx.fill();
    ctx.fillStyle='#7d8a95'; ctx.fillRect(-15,y0-30,30,4);
    ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(-7,y0-70,3,40);
    ctx.restore();
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  // искры
  const sparks=[];
  function spawn(theta){
    const n=2+Math.floor(Math.random()*4), [x,y]=pt(theta,RO+1);
    const normal=rad(theta)-Math.PI/2, tang=normal-Math.PI/2; // касательная против движения горелки
    for(let i=0;i<n;i++){
      const a=normal+(Math.random()-.5)*2.3, s=1.6+Math.random()*4.4, back=Math.random()*1.8;
      sparks.push({x,y,vx:Math.cos(a)*s+Math.cos(tang)*back,vy:Math.sin(a)*s+Math.sin(tang)*back,life:0,max:16+Math.random()*26,hot:Math.random()});
    }
  }
  function drawSparks(){
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
    ctx.beginPath(); ctx.rect(0,0,W,430); ctx.clip(); // искры не заходят на надпись
    for(let i=sparks.length-1;i>=0;i--){
      const p=sparks[i]; p.life++; p.vy+=.13; p.vx*=.985; p.x+=p.vx; p.y+=p.vy;
      const k=(1-p.life/p.max)*Math.min(1,Math.max(0,(430-p.y)/60)); if(k<=0||p.life>=p.max){ sparks.splice(i,1); continue; }
      const hue=28+p.hot*22, light=62+k*30;
      ctx.strokeStyle=`hsla(${hue},100%,${light}%,${k})`; ctx.lineWidth=1+k*1.2;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*2.2,p.y-p.vy*2.2); ctx.stroke();
    }
    ctx.restore();
  }

  function frame(theta,f,live){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const bg=ctx.createRadialGradient(CX,CY,40,CX,CY,620); bg.addColorStop(0,'#141b22'); bg.addColorStop(1,'#080b0e');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    // отсвет дуги на фоне
    const [lx,ly]=pt(theta,RO); const lg=ctx.createRadialGradient(lx,ly,0,lx,ly,420);
    lg.addColorStop(0,`rgba(120,160,220,${.10*f})`); lg.addColorStop(1,'rgba(120,160,220,0)'); ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
    ticks(); pipe(); bead(theta); glow(theta,f); torch(theta);
    if(live){ spawn(theta); drawSparks(); }
  }

  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fixed=/[#&]a=(\d+)/.exec(location.hash);
  if(still||fixed){ redraw=()=>frame(fixed?+fixed[1]:210,1,false); redraw(); return; }
  let t0=performance.now();
  (function loop(now){
    const theta=((now-t0)/PERIOD*360)%360;
    const f=.82+Math.random()*.18+Math.sin(now/90)*.04;
    frame(theta,f,true);
    requestAnimationFrame(loop);
  })(t0);
}

/* масштаб корпуса под окно */
function fit(){
  const k=Math.min((innerWidth-32)/1064,(innerHeight-60)/640);
  const rig=document.getElementById('rig'); rig.style.width=1064*k+'px'; rig.style.height=640*k+'px';
  document.getElementById('device').style.transform=`scale(${k})`;
}
addEventListener('resize',fit); fit();
initWeldAnim(document.getElementById('weld'));
</script>
</body>
</html>
